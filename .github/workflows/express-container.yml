name: Express Container

on:
  pull_request:
    branches: [main, create-hemlchart]
    paths:
      - ".dockerignore"
      - ".github/workflows/express-container.yml"
      - "apps/express-server/**"
      - "deploy/docker/express/**"
      - "packages/env/**"
      - "packages/graphql-client/**"
      - "packages/otel/**"
      - "patches/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".github/workflows/express-container.yml"
      - "apps/express-server/**"
      - "deploy/docker/express/**"
      - "packages/env/**"
      - "packages/graphql-client/**"
      - "packages/otel/**"
      - "patches/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"

permissions:
  contents: read

jobs:
  smoke-test:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and smoke test Express image
        run: deploy/docker/express/smoke-test.sh
