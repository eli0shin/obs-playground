name: GraphQL Container

on:
  pull_request:
    branches: [main, create-hemlchart]

permissions:
  contents: read

jobs:
  smoke-test:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and smoke test GraphQL image
        run: deploy/docker/graphql/smoke-test.sh
