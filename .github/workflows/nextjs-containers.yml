name: Next.js Containers

on:
  pull_request:
    branches: [main, create-hemlchart]
    paths:
      - ".dockerignore"
      - ".github/workflows/nextjs-containers.yml"
      - "apps/nextjs-app/**"
      - "deploy/docker/nextjs/**"
      - "deploy/docker/nextjs-custom/**"
      - "packages/env/**"
      - "packages/graphql-client/**"
      - "packages/otel/**"
      - "packages/trpc-otel/**"
      - "patches/**"
      - "scripts/smoke-nextjs-containers.sh"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".github/workflows/nextjs-containers.yml"
      - "apps/nextjs-app/**"
      - "deploy/docker/nextjs/**"
      - "deploy/docker/nextjs-custom/**"
      - "packages/env/**"
      - "packages/graphql-client/**"
      - "packages/otel/**"
      - "packages/trpc-otel/**"
      - "patches/**"
      - "scripts/smoke-nextjs-containers.sh"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"

permissions:
  contents: read

jobs:
  smoke-test:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and smoke test Next.js images
        run: scripts/smoke-nextjs-containers.sh
