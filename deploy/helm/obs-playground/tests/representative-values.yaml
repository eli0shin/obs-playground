global:
  env:
    - name: EXAMPLE_RUNTIME_SETTING
      value: global-default

publicBaseUrls:
  graphql: https://graphql.example.test
  express: https://express.example.test

datadog:
  otlpProtocol: grpc
  otlpEndpoint: http://datadog-agent.monitoring.svc.cluster.local:4317

persistence:
  storageClass: test-storage
  capacity: 2Gi

# Representative timings for telemetry-heavy startup on the homelab.
probes:
  startup:
    path: /health
    port: http
    periodSeconds: 6
    timeoutSeconds: 3
    failureThreshold: 25

workloads:
  graphql:
    replicaCount: 2
    service:
      port: 80
    ingress:
      enabled: true
      hosts:
        - host: graphql.example.test
          paths:
            - path: /
              pathType: Prefix
  express:
    env:
      - name: EXAMPLE_RUNTIME_SETTING
        value: configured-at-runtime
    ingress:
      enabled: true
      hosts:
        - host: express.example.test
          paths:
            - path: /
              pathType: Prefix
  nextjs:
    replicaCount: 3
    ingress:
      enabled: true
      hosts:
        - host: nextjs.example.test
          paths:
            - path: /
              pathType: Prefix
  nextjsCustom:
    replicaCount: 4
    ingress:
      enabled: true
      hosts:
        - host: nextjs-custom.example.test
          paths:
            - path: /
              pathType: Prefix
  tanstack:
    replicaCount: 5
    ingress:
      enabled: true
      hosts:
        - host: tanstack.example.test
          paths:
            - path: /
              pathType: Prefix
