nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

# These variables are added to every service. Use secretKeyRef entries for secrets.
global:
  env: []

# Browser-reachable backend URLs injected into frontend pages at runtime.
# Keep these separate from the cluster-local URLs used by server-side requests.
publicBaseUrls:
  graphql: ""
  express: ""

datadog:
  otlpProtocol: grpc
  # Leave empty to disable the Datadog exporter. For example:
  # http://datadog-agent.datadog.svc.cluster.local:4317
  otlpEndpoint: ""

persistence:
  storageClass: ""
  capacity: 1Gi
  existingClaim: ""

# Startup probes delay readiness and liveness checks until each service is listening.
# The default 150-second window accommodates telemetry initialization on slower hosts.
probes:
  startup:
    path: /health
    port: http
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 30

workloads:
  graphql:
    replicaCount: 1
    containerPort: 4000
    image:
      repository: ghcr.io/eli0shin/obs-playground-graphql
      tag: ""
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 4000
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    env: []
    ingress:
      enabled: false
      className: ""
      annotations: {}
      hosts: []
      tls: []

  express:
    containerPort: 3001
    image:
      repository: ghcr.io/eli0shin/obs-playground-express
      tag: ""
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 3001
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    env: []
    ingress:
      enabled: false
      className: ""
      annotations: {}
      hosts: []
      tls: []

  nextjs:
